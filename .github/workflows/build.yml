name: build-tipa
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install ldid
        run: brew install ldid
      - name: Build .tipa
        run: bash ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneAgent-tipa
          path: PhoneAgent.tipa
      - name: Create GitHub Release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PhoneAgent.tipa
