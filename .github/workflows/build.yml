name: build-tipa
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ldid
        run: brew install ldid
      - name: Build .tipa
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneAgent-tipa
          path: PhoneAgent.tipa
